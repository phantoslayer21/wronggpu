# WrongGPU settings: the one settings file of every WrongGPU DLL (<game exe folder>\WrongGPU\wronggpu.ini).
# Delete this file to restore the defaults. The [wronggpu] section is generated from WrongGPU's registry
# (clean/wgshared/registry/registry.json); while OptiScaler shows WrongGPU's entries, the entry chosen in its
# menu is written back here, so the next start without OptiScaler keeps it. A process environment variable
# named on a key's comment overrides the key for that process.
[wronggpu]
# sr_model: super-resolution model. Values: M | K. Default: M. Read by: sr-frontend, sr-runtime; applied at the next
# SR create. Environment: WG_RUNTIME_MODEL.
sr_model = M
# rr_mode: ray-reconstruction mode. Values: exact | accurate | fast. Default: accurate. Read by: rr-plugin,
# rr-runtime; applied at the next frame. Environment: WG_RR_MODE.
rr_mode = accurate
# rr_enabled: WrongGPU RR on/off (60.9 key 0). Values: 0 | 1. Default: 1. Read by: rr-plugin; applied when the game
# creates RR.
rr_enabled = 1
# rr_specular_motion_from_v: 62.4 / 52.7.1 SV = V (opt-in). Values: 0 | 1. Default: 0. Read by: rr-plugin; applied
# at the next frame. Opt-in: changes the output.
rr_specular_motion_from_v = 0
# rr_reset_after_failed_evaluate: 61.6 / 53.10 deviation (opt-in). Values: 0 | 1. Default: 0. Read by: rr-plugin;
# applied at the next frame. Opt-in: changes the output.
rr_reset_after_failed_evaluate = 0
# rr_change_frame_reset: 53.9 deviation (opt-in). Values: 0 | 1. Default: 0. Read by: rr-plugin; applied at the next
# frame. Opt-in: changes the output.
rr_change_frame_reset = 0
# rr_bounded_stores: 54b.0.1 bounded stores (opt-in). Values: 0 | 1. Default: 0. Read by: rr-plugin, rr-runtime;
# applied at the next frame. Opt-in: changes the output.
rr_bounded_stores = 0
# sr_fallback_to_amd: hand a failed SR context to AMD's upscaler. Values: 0 | 1. Default: 1. Read by: sr-frontend;
# applied at the next SR create.
sr_fallback_to_amd = 1
# rr_accept_provisional_families: hook a game-interface family whose layouts are not confirmed. Values: 0 | 1.
# Default: 0. Read by: rr-plugin; applied at game start.
rr_accept_provisional_families = 0
# entry_source: how the host offers the choices: one version list, or one folder per choice. Values: versions |
# folders. Default: versions. Read by: sr-frontend; applied at game start.
entry_source = versions
# rr_exact_allowed: exact RR mode offered in the menu panel (turned on in the launcher; without it rr_mode=exact
# runs accurate). Values: 0 | 1. Default: 0. Read by: rr-plugin; applied at game start.
rr_exact_allowed = 0
# rr_hit_distance_filter: 52.7.2 deviation (opt-in): the specular hit distance is the median of its 1x4 pixel run
# (lone missed-ray outliers make reflection speckles in motion). Values: 0 | 1. Default: 0. Read by: rr-plugin;
# applied at the next frame. Opt-in: changes the output.
rr_hit_distance_filter = 0
# rr_model: path of the RR model file. Read by: rr-plugin, rr-runtime. Environment: WG_RR_MODEL.
rr_model =
# sr_runtime_dll: SR runtime library in the data folder. Read by: sr-frontend.
sr_runtime_dll = wronggpu_runtime.dll
# rr_runtime_dll: RR runtime library (since 0.6.0 part of wronggpu_runtime.dll, Model M and RR in one DLL). Read by:
# rr-plugin.
rr_runtime_dll = wronggpu_runtime.dll
# diag_env_1: WG_RR_<NAME>=<value> handed to the RR runtime (diagnostics). Read by: rr-plugin.
diag_env_1 =
# diag_env_2: as above. Read by: rr-plugin.
diag_env_2 =
# diag_env_3: as above. Read by: rr-plugin.
diag_env_3 =
# diag_env_4: as above. Read by: rr-plugin.
diag_env_4 =
