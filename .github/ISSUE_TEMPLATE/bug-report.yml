name: Bug report
description: Report a WrongGPU, installer or tested-game problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a first report about another game's compatibility, use the **Game compatibility report** form.
        Please do not attach NVIDIA DLLs or converted model files.
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: What you expected and what happened instead. Include the game and its version, or say if this is an installer problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: system
    attributes:
      label: Graphics card, driver, Windows version
      placeholder: "RX 9070 XT, Adrenalin version, Windows 11 version"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Installer / mod version
      placeholder: "0.3.1"
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Game settings and model state
      placeholder: "2560x1440, AMD FSR 3 Quality, Model M running, RT off, FG off"
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Use Collect logs in the installer, or Modify for your game in Installed apps. If setup failed, attach %LOCALAPPDATA%\WrongGPU\setup.log. Add a screenshot or clip where useful. Review logs before sharing; paths may include your Windows user name.
