name: Bug report
description: Report a WrongGPU, launcher or tested-game problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a first report about another game's compatibility, use the **Game compatibility report** form.
        Please do not attach NVIDIA DLLs or converted model files.
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: What you expected and what happened instead. Include the game and its version, or say if this is a launcher problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: system
    attributes:
      label: Graphics card, driver, Windows version
      placeholder: "RX 9070 XT, Adrenalin version, Windows 11 version"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WrongGPU version
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Game settings and model state
      placeholder: "2560x1440, DLSS Quality, Ray Reconstruction Fast, path tracing on, FG off"
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Use Collect logs on the game's page in the launcher. If the launcher itself failed, attach %LOCALAPPDATA%\WrongGPU\launcher.log. Add a screenshot or clip where useful. Review logs before sharing; paths may include your Windows user name.
